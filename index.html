<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>미술치료 일지 및 사진대장</title>
  <style>
    :root{--bg:#eef3f5;--paper:#fff;--ink:#111827;--muted:#60727d;--line:#d8e1e5;--field:#fbfdfd;--green:#087f6d;--red:#d9463e;--red-soft:#fff0ee;--button:#edf3f3}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:"Malgun Gothic",system-ui,sans-serif}button,input,textarea,select{font:inherit}
    button,.file-btn{min-height:48px;border:1px solid var(--line);border-radius:7px;background:var(--button);font-weight:800;padding:10px 12px;cursor:pointer;text-align:center;color:var(--ink)}
    button.primary{background:var(--green);border-color:var(--green);color:#fff}button.danger{background:var(--red-soft);border-color:#f0bbb7;color:var(--red)}button.slim{min-height:38px;padding:6px 10px}
    .shell{width:min(100%,480px);min-height:100vh;margin:0 auto;padding-bottom:78px;background:var(--bg)}header{position:sticky;top:0;z-index:5;background:#fff;border-top:8px solid #14212b;border-bottom:1px solid #dce4e8;padding:16px 18px 14px}header span{display:block;color:var(--green);font-size:12px;font-weight:900;margin-bottom:5px}header h1{margin:0;font-size:24px;line-height:1.2}
    .view{display:none;padding:10px}.view.active{display:block}.card{position:relative;background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:16px;margin-bottom:8px;box-shadow:0 1px 2px rgba(16,24,40,.04)}.card.accent:before{content:"";position:absolute;left:0;top:10px;bottom:10px;width:5px;border-radius:0 5px 5px 0;background:var(--green)}
    .card-title{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}h2{margin:0 0 12px;font-size:17px}.card-title h2{margin:0}label{display:grid;gap:7px;margin-bottom:12px;color:#455963;font-size:13px;font-weight:900}
    input,textarea,select{width:100%;min-height:48px;border:1px solid #cfd9de;border-radius:7px;background:var(--field);padding:12px 13px;color:var(--ink)}textarea{resize:vertical;line-height:1.55}.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}.three{display:grid;grid-template-columns:1fr 76px 76px;gap:8px}.field-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    .combo{position:relative;min-width:0}.combo-menu{position:absolute;left:0;right:0;top:calc(100% + 4px);z-index:30;display:none;max-height:220px;overflow:auto;border:1px solid #cfd9de;border-radius:8px;background:#fff;box-shadow:0 12px 30px rgba(16,24,40,.16)}.combo.open .combo-menu{display:block}.combo-item{display:grid;grid-template-columns:1fr 38px;align-items:center;min-height:42px;border-bottom:1px solid #edf1f3}.combo-pick{width:100%;min-height:42px;border:0;border-radius:0;background:#fff;text-align:left;font-weight:700;padding:8px 12px}.combo-remove{min-height:38px;border:0;border-left:1px solid #edf1f3;border-radius:0;background:#fff;color:var(--red);font-size:18px;padding:0}.combo-empty{padding:12px;color:var(--muted);font-size:13px}
    .attendee-row{display:grid;grid-template-columns:112px 1fr 64px;gap:8px;margin-bottom:8px}.media-display{min-height:48px;border:1px solid #cfd9de;border-radius:7px;background:var(--field);padding:12px 13px;line-height:1.4}.media-picker{display:grid;gap:8px}.media-option{display:grid;grid-template-columns:24px 1fr;align-items:center;gap:8px;min-height:42px;border:1px solid var(--line);border-radius:7px;background:#fbfdfd;padding:8px 10px;font-size:14px;font-weight:800}.media-option input{min-height:auto;width:18px;height:18px;padding:0}.media-empty{color:var(--muted);font-size:13px;padding:4px 0}.media-settings-list{display:grid;gap:7px;max-height:220px;overflow:auto;margin-top:12px}.media-settings-item{display:grid;grid-template-columns:1fr 42px;align-items:center;border:1px solid var(--line);border-radius:7px;background:#fbfdfd;overflow:hidden}.media-settings-item span{padding:10px 12px;font-weight:800}.media-settings-item button{min-height:42px;border:0;border-left:1px solid var(--line);border-radius:0;background:var(--red-soft);color:var(--red);font-size:18px;padding:0}
    .session-row{border:1px solid var(--line);border-radius:8px;padding:10px;margin-bottom:10px;background:#fbfdfd}.session-row-head{display:grid;grid-template-columns:1fr 64px;gap:8px;margin-bottom:8px}.session-row textarea{min-height:110px;background:#fff}.camera-box{display:grid;gap:10px;margin-top:10px}video{width:100%;border-radius:8px;background:#111}.file-btn input{display:none}.photo-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:12px}.photo-card{border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#fff}.photo-card img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block;background:#e5ecef}.photo-card footer{display:grid;grid-template-columns:1fr auto;align-items:center;gap:6px;padding:7px}.photo-card span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted);font-size:12px}
    .journal-list{display:grid;gap:8px}.journal-item{width:100%;text-align:left;background:#fff;min-height:74px}.journal-item strong{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.journal-item span{display:block;margin-top:4px;color:var(--muted);font-size:12px}.output-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.hint{margin:8px 0 0;color:var(--muted);font-size:13px;line-height:1.5}
    .journal-actions{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-top:9px}.journal-actions button{min-height:38px;padding:6px 8px;font-size:12px}.saving-banner{position:fixed;left:50%;top:14px;z-index:80;transform:translateX(-50%);width:min(92vw,420px);display:none;align-items:center;justify-content:center;gap:10px;border-radius:9px;background:#087f6d;color:#fff;font-weight:900;padding:12px 14px;box-shadow:0 14px 34px rgba(0,0,0,.2)}.saving-banner.active{display:flex}.saving-dot{width:10px;height:10px;border-radius:50%;background:#fff;animation:pulse .8s infinite alternate}@keyframes pulse{from{opacity:.35;transform:scale(.8)}to{opacity:1;transform:scale(1.15)}}button[disabled]{opacity:.72;cursor:wait}
    nav{position:fixed;left:50%;bottom:0;transform:translateX(-50%);z-index:20;width:min(100%,480px);display:grid;grid-template-columns:repeat(5,1fr);background:#fff;border-top:1px solid #d8e1e5;box-shadow:0 -8px 22px rgba(16,24,40,.08)}nav button{border:0;border-radius:0;background:#fff;min-height:66px;display:grid;place-items:center;gap:2px;padding:7px 3px;color:#536873;font-size:11px}nav b{font-size:22px;line-height:1}nav button.active{color:var(--green)}
    dialog{border:0;border-radius:10px;padding:20px;width:min(92vw,380px);box-shadow:0 26px 70px rgba(0,0,0,.25)}dialog label{display:block;margin:10px 0;font-weight:700}.dialog-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}.toast{position:fixed;left:50%;bottom:78px;transform:translateX(-50%);z-index:50;width:min(92vw,430px);padding:12px 14px;border-radius:8px;background:#17202a;color:#fff;box-shadow:0 12px 30px rgba(0,0,0,.2)}.hidden{display:none!important}@media (min-width:900px){body{background:#dce6e9}.shell{box-shadow:0 0 0 1px rgba(16,24,40,.08),0 20px 60px rgba(16,24,40,.12)}}
  </style>
</head>
<body>
  <main class="shell">
    <header><span>미술치료 기록 관리</span><h1>미술치료 일지 및 사진대장</h1></header>
    <section id="view-basic" class="view active">
      <form id="journalForm">
        <input id="id" type="hidden">
        <section class="card accent">
          <div class="card-title"><h2>일지 관리</h2></div>
          <label>저장된 일지<select id="journalSelect"></select></label>
          <div class="two"><button type="button" onclick="loadSelectedJournal()">불러오기</button><button type="button" class="primary" onclick="newJournal()">새 일지</button><button type="button" class="danger" onclick="openDeleteDialog()">삭제</button><button type="button" class="save-button" onclick="saveJournal()">저장</button></div>
        </section>
        <section class="card">
          <label>제목<input id="title" data-option-type="title"></label>
          <label>일시<input id="journalDate" type="text"></label>
          <label>장소<input id="place" data-option-type="place"></label>
          <div class="field-row"><label>프로그램명<input id="programName" data-option-type="programName"></label><label>미술치료사<input id="therapist" data-option-type="therapist"></label></div>
          <label>매체<input id="media" type="hidden"><div id="mediaDisplay" class="media-display">선택된 매체가 없습니다.</div><div class="two"><button type="button" onclick="openMediaSelectDialog()">매체선택</button><button type="button" onclick="openMediaSettingsDialog()">설정</button></div></label>
        </section>
        <section class="card"><div class="card-title"><h2>참석자</h2><button type="button" class="slim" onclick="addAttendeeRow()">추가</button></div><div id="attendees"></div></section>
      </form>
    </section>
    <section id="view-session" class="view"><section class="card"><div class="card-title"><h2>회기내용</h2><div><button type="button" class="slim" onclick="addSessionRow()">추가</button> <button type="button" class="slim primary save-button" onclick="saveJournal()">저장</button></div></div><div id="sessions"></div><p class="hint">성명과 내용을 행별로 입력하면 PDF 출력 시 사람별 구분선이 들어갑니다.</p></section></section>
    <section id="view-photo" class="view"><section class="card"><div class="card-title"><h2>사진 입력</h2><button type="button" class="slim primary save-button" onclick="saveJournal()">저장</button></div><label>사진대장 날짜<input id="photoDate" type="date"></label><div class="two"><button type="button" onclick="startCamera()">사진찍기</button><label class="file-btn">사진 불러오기<input id="photoInput" type="file" accept="image/*" multiple onchange="loadPhotoFiles(this.files)"></label></div><div id="cameraBox" class="camera-box hidden"><video id="camera" autoplay playsinline></video><div class="two"><button type="button" class="primary" onclick="capturePhoto()">촬영</button><button type="button" onclick="stopCamera()">닫기</button></div></div><div id="photoGrid" class="photo-grid"></div></section></section>
    <section id="view-list" class="view"><section class="card"><div class="card-title"><h2>조회</h2><button type="button" class="slim" onclick="newJournal()">새 일지</button></div><label>날짜별 조회<input id="listDateFilter" type="date" onchange="renderJournalList()"></label><div id="journalList" class="journal-list"></div></section></section>
    <section id="view-output" class="view"><section class="card accent"><h2>출력</h2><div class="output-grid"><button type="button" onclick="openCurrent('diaryPdfUrl')">일지 PDF 보기</button><button type="button" onclick="openCurrent('ledgerPdfUrl')">사진대장 보기</button><button type="button" onclick="openFolder('photoFolderUrl')">원본사진 보기</button><button type="button" class="primary" onclick="openSubmissionDialog()">제출용 출력</button></div></section><section class="card"><h2>Apps Script 주소</h2><label>웹앱 /exec 주소<input id="apiUrlInput" placeholder="https://script.google.com/macros/s/.../exec"></label><div class="two"><button type="button" onclick="saveApiUrl()">주소 저장</button><button type="button" onclick="testApiUrl()">연결 확인</button></div><p class="hint">Google Apps Script 웹앱 배포 후 나온 /exec 주소를 입력합니다.</p></section><section class="card"><h2>연결 상태</h2><p id="apiStatus" class="hint">불러오는 중입니다.</p></section></section>
    <nav><button type="button" class="active" data-view="basic" onclick="showView('basic')"><b>＋</b><span>입력</span></button><button type="button" data-view="session" onclick="showView('session')"><b>≡</b><span>내용</span></button><button type="button" data-view="photo" onclick="showView('photo')"><b>▧</b><span>사진</span></button><button type="button" data-view="list" onclick="showView('list')"><b>⌕</b><span>조회</span></button><button type="button" data-view="output" onclick="showView('output')"><b>⚙</b><span>출력</span></button></nav>
  </main>
  <datalist id="titleList"></datalist><datalist id="placeList"></datalist><datalist id="programNameList"></datalist><datalist id="therapistList"></datalist><datalist id="attendeeNameList"></datalist>
  <dialog id="submissionDialog"><h2>제출용 출력</h2><label><input type="checkbox" id="includeDiary" checked> 일지 포함</label><label><input type="checkbox" id="includeLedger" checked> 사진대장 포함</label><div class="dialog-actions"><button type="button" onclick="closeDialog('submissionDialog')">취소</button><button type="button" class="primary" onclick="createSubmission()">생성</button></div></dialog>
  <dialog id="mediaSelectDialog"><h2>매체선택</h2><div id="mediaPicker" class="media-picker"></div><div class="dialog-actions"><button type="button" onclick="clearMediaSelection()">선택 해제</button><button type="button" class="primary" onclick="closeDialog('mediaSelectDialog')">완료</button></div></dialog>
  <dialog id="mediaSettingsDialog"><h2>매체 설정</h2><label>재료 추가<div class="two"><input id="settingsMedia" placeholder="예: 물감"><button type="button" onclick="settingsAddMedia()">추가</button></div></label><div id="mediaSettingsList" class="media-settings-list"></div><div class="dialog-actions"><button type="button" class="primary" onclick="closeDialog('mediaSettingsDialog')">닫기</button></div></dialog>
  <dialog id="deleteDialog"><h2>삭제</h2><label><input type="checkbox" id="deleteData"> 일지 데이터 삭제</label><label><input type="checkbox" id="deleteDiaryPdf"> 일지 PDF 삭제</label><label><input type="checkbox" id="deleteLedgerPdf"> 사진대장 PDF 삭제</label><label><input type="checkbox" id="deleteSubmissionPdf"> 제출용 PDF 삭제</label><label><input type="checkbox" id="deleteOriginalPhotos"> 원본사진 삭제</label><p class="hint">사진대장 PDF를 삭제해도 원본사진은 삭제되지 않습니다.</p><div class="dialog-actions"><button type="button" onclick="closeDialog('deleteDialog')">취소</button><button type="button" class="danger" onclick="deleteSelectedParts()">삭제</button></div></dialog>
  <div id="savingBanner" class="saving-banner"><span class="saving-dot"></span><span>저장 중입니다</span></div>
  <div id="toast" class="toast hidden"></div>
  <script>
    const DEFAULT_API_URL='https://script.google.com/macros/s/AKfycbzpTXRSanMesMRsmQeItoEjvPSS3yP0VlywtIub6uJLxrsgVnVnZcY0zkcYuUyFjOs/exec';
    let API_URL=localStorage.getItem('artTherapyApiUrl')||DEFAULT_API_URL;
    const state={options:{},journals:[],current:null,photos:[],folders:{},cameraStream:null,saving:false};
    document.addEventListener('DOMContentLoaded',()=>{setVal('apiUrlInput',API_URL);bootstrap()});
    function jsonp(action,params={}){return new Promise((resolve,reject)=>{const cb='cb_'+Date.now()+'_'+Math.random().toString(36).slice(2);const url=new URL(API_URL);url.searchParams.set('action',action);url.searchParams.set('callback',cb);Object.entries(params).forEach(([k,v])=>url.searchParams.set(k,v));const s=document.createElement('script');const timer=setTimeout(()=>{delete window[cb];s.remove();reject(new Error('API 응답이 없습니다.'))},20000);window[cb]=data=>{clearTimeout(timer);delete window[cb];s.remove();data&&data.error?reject(new Error(data.error)):resolve(data)};s.onerror=()=>{clearTimeout(timer);delete window[cb];s.remove();reject(new Error('API 연결 실패'))};s.src=url.toString();document.body.appendChild(s)})}
    function post(action,payload={},delay=1400){const fd=new FormData();fd.append('action',action);fd.append('payload',JSON.stringify(payload));return fetch(API_URL,{method:'POST',mode:'no-cors',body:fd}).then(()=>wait(delay))}
    function bootstrap(){jsonp('bootstrap').then(data=>{state.options=data.options||{};loadLocalMediaOptions();state.journals=data.journals||[];state.folders={rootFolderUrl:data.rootFolderUrl,photoFolderUrl:data.photoFolderUrl,pdfFolderUrl:data.pdfFolderUrl};setText('apiStatus','GitHub Pages 화면 + Google Drive DB 연결됨');fillLists();renderJournalSelect();renderJournalList();newJournal(false)}).catch(e=>{setText('apiStatus','API 연결 전입니다. Apps Script API 배포 후 작동합니다.');toast(e.message);state.options={title:['미술치료 일지'],attendeeName:[]};loadLocalMediaOptions();fillLists();newJournal(false)})}
    function saveApiUrl(){const next=val('apiUrlInput');if(!next)return toast('Apps Script 주소를 입력하세요.');if(!/^https:\/\/script\.google\.com\/macros\/s\/.+\/exec$/.test(next))return toast('/exec로 끝나는 Apps Script 웹앱 주소를 입력하세요.');API_URL=next;localStorage.setItem('artTherapyApiUrl',next);toast('Apps Script 주소를 저장했습니다.');bootstrap()}
    function testApiUrl(){saveApiUrl()}
    function refresh(cb){jsonp('bootstrap').then(data=>{state.options=data.options||{};loadLocalMediaOptions();state.journals=data.journals||[];state.folders={rootFolderUrl:data.rootFolderUrl,photoFolderUrl:data.photoFolderUrl,pdfFolderUrl:data.pdfFolderUrl};fillLists();renderJournalSelect();renderJournalList();if(cb)cb()}).catch(showError)}
    function fillLists(){[['titleList','title'],['placeList','place'],['programNameList','programName'],['therapistList','therapist'],['attendeeNameList','attendeeName']].forEach(([id,key])=>{document.getElementById(id).innerHTML=(state.options[key]||[]).map(v=>`<option value="${attr(v)}"></option>`).join('')});setupAutoComplete();renderMediaPicker();renderMediaSettingsList()}
    function setupAutoComplete(root=document){root.querySelectorAll('[data-option-type]').forEach(input=>enhanceCombo(input,input.dataset.optionType));renderAllComboMenus()}
    function enhanceCombo(input,type){if(input.dataset.comboReady)return;input.dataset.comboReady='1';const w=document.createElement('div');w.className='combo';input.parentNode.insertBefore(w,input);w.appendChild(input);const m=document.createElement('div');m.className='combo-menu';w.appendChild(m);input.addEventListener('focus',()=>openCombo(input));input.addEventListener('click',()=>openCombo(input));input.addEventListener('input',()=>renderComboMenu(input));input.addEventListener('blur',()=>{saveOptionFromInput(input,true);setTimeout(()=>w.classList.remove('open'),150)});input.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();saveOptionFromInput(input,false);w.classList.remove('open')}})}
    function openCombo(input){renderComboMenu(input);input.closest('.combo').classList.add('open')}function renderAllComboMenus(){document.querySelectorAll('[data-option-type]').forEach(renderComboMenu)}
    function renderComboMenu(input){const type=input.dataset.optionType,menu=input.closest('.combo').querySelector('.combo-menu'),q=input.value.trim(),values=(state.options[type]||[]).filter(v=>!q||v.includes(q));menu.innerHTML=values.length?values.map(v=>`<div class="combo-item"><button type="button" class="combo-pick" data-value="${attr(v)}">${esc(v)}</button><button type="button" class="combo-remove" data-value="${attr(v)}">×</button></div>`).join(''):'<div class="combo-empty">저장된 항목이 없습니다.</div>';menu.querySelectorAll('.combo-pick').forEach(b=>b.onclick=()=>{input.value=b.dataset.value;input.closest('.combo').classList.remove('open');input.focus()});menu.querySelectorAll('.combo-remove').forEach(b=>b.onclick=e=>{e.stopPropagation();deleteOptionValue(type,b.dataset.value,input)})}
    function saveOptionFromInput(input,silent){const type=input.dataset.optionType,val=input.value.trim();if(!type||!val||(state.options[type]||[]).map(String).includes(val))return;jsonp('addOption',{type,value:val}).then(data=>{state.options=data.options||state.options;state.journals=data.journals||state.journals;fillLists();renderJournalSelect();renderJournalList();if(!silent)toast('목록에 저장했습니다.')}).catch(showError)}
    function deleteOptionValue(type,valueToDelete,sourceInput){jsonp('deleteOption',{type,value:valueToDelete}).then(data=>{state.options=data.options||state.options;state.journals=data.journals||state.journals;if(sourceInput&&sourceInput.value===valueToDelete)sourceInput.value='';fillLists();renderJournalSelect();renderJournalList();toast('목록에서 삭제했습니다.')}).catch(showError)}
    function renderJournalSelect(){document.getElementById('journalSelect').innerHTML='<option value="">일지 선택</option>'+state.journals.map(r=>`<option value="${attr(r.id)}">${esc(formatDateOnly(r.journalDate)||'')} ${esc(r.title||'')}</option>`).join('')}
    function renderJournalList(){const list=document.getElementById('journalList'),filter=val('listDateFilter');const rows=state.journals.filter(r=>!filter||formatDateOnly(r.journalDate)===filter||formatDateOnly(r.photoDate)===filter);list.innerHTML=rows.length?rows.map(r=>`<article class="journal-item"><strong>${esc(r.title||'미술치료 일지')}</strong><span>${esc(formatDateOnly(r.journalDate)||'')} · ${esc(r.place||'')}</span><div class="journal-actions"><button type="button" onclick="loadJournal('${r.id}')">불러오기</button><button type="button" onclick="openJournalPdf('${r.id}','diaryPdfUrl')">치료일지</button><button type="button" onclick="openJournalPdf('${r.id}','ledgerPdfUrl')">사진대장</button></div></article>`).join(''):'<button type="button" class="journal-item">해당 날짜의 일지가 없습니다.</button>'}
    function showView(name){document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));document.getElementById('view-'+name).classList.add('active');document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.view===name))}
    function newJournal(move=true){state.current=null;state.photos=[];document.getElementById('journalForm').reset();setVal('id','');const today=todayText();setVal('title','미술치료 일지');setVal('journalDate',today);setVal('photoDate',today);setVal('media','');document.getElementById('attendees').innerHTML='';document.getElementById('sessions').innerHTML='';addAttendeeRow();addSessionRow();renderPhotos();if(move)showView('basic')}
    function loadSelectedJournal(){const id=val('journalSelect');if(!id)return toast('불러올 일지를 선택하세요.');loadJournal(id)}
    function loadJournal(id){jsonp('getJournal',{id}).then(row=>{state.current=row;state.photos=row.photos||[];['id','title','journalDate','place','programName','therapist','photoDate','media'].forEach(k=>setVal(k,row[k]));document.getElementById('attendees').innerHTML='';(row.attendees||[]).forEach(x=>addAttendeeRow(x.time,x.name));if(!(row.attendees||[]).length)addAttendeeRow();document.getElementById('sessions').innerHTML='';(row.sessionRows||[]).forEach(x=>addSessionRow(x.name,x.content));if(!(row.sessionRows||[]).length)addSessionRow();renderPhotos();renderMediaPicker();showView('basic')}).catch(showError)}
    function addAttendeeRow(time='',name=''){const row=document.createElement('div');row.className='attendee-row';row.innerHTML=`<input class="attendee-time" placeholder="시간" value="${attr(time)}"><input class="attendee-name" data-option-type="attendeeName" placeholder="성명" value="${attr(name)}"><button type="button" class="danger slim">삭제</button>`;row.querySelector('button').onclick=()=>row.remove();const t=row.querySelector('.attendee-time');t.addEventListener('blur',()=>t.value=formatTimeValue(t.value));t.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();t.value=formatTimeValue(t.value);row.querySelector('.attendee-name').focus()}});document.getElementById('attendees').appendChild(row);setupAutoComplete(row)}
    function addSessionRow(name='',content=''){const row=document.createElement('article');row.className='session-row';row.innerHTML=`<div class="session-row-head"><input class="session-name" data-option-type="attendeeName" placeholder="성명" value="${attr(name)}"><button type="button" class="danger slim">삭제</button></div><textarea class="session-content" placeholder="내용을 입력하세요">${esc(content)}</textarea>`;row.querySelector('button').onclick=()=>row.remove();document.getElementById('sessions').appendChild(row);setupAutoComplete(row)}
    function collectPayload(){return{id:val('id'),title:val('title'),journalDate:val('journalDate'),place:val('place'),programName:val('programName'),therapist:val('therapist'),photoDate:val('photoDate')||todayText(),media:val('media'),attendees:[...document.querySelectorAll('.attendee-row')].map(r=>({time:r.querySelector('.attendee-time').value.trim(),name:r.querySelector('.attendee-name').value.trim()})).filter(x=>x.time||x.name),sessionRows:[...document.querySelectorAll('.session-row')].map(r=>({name:r.querySelector('.session-name').value.trim(),content:r.querySelector('.session-content').value.trim()})).filter(x=>x.name||x.content),photos:state.photos}}
    function saveJournal(){if(state.saving)return;const payload=collectPayload();setSaving(true);toast('저장 중입니다. 사진과 PDF를 생성하고 있습니다.');post('saveJournal',payload,6500).then(()=>refresh(()=>{const savedId=payload.id||(state.journals[0]&&state.journals[0].id);if(savedId)loadJournal(savedId);setSaving(false);toast('저장하고 PDF를 생성했습니다.')})).catch(e=>{setSaving(false);showError(e)})}
    function renderMediaPicker(){const picker=document.getElementById('mediaPicker');if(!picker)return;const selected=selectedMediaValues(),media=(state.options.media||[]).map(String);picker.innerHTML=media.length?media.map(item=>`<label class="media-option"><input type="checkbox" value="${attr(item)}" ${selected.includes(item)?'checked':''} onchange="updateMediaFromChecks()"><span>${esc(item)}</span></label>`).join(''):'<div class="media-empty">설정에서 매체 재료를 추가하세요.</div>';updateMediaDisplay()}
    function renderMediaSettingsList(){const list=document.getElementById('mediaSettingsList');if(!list)return;const media=(state.options.media||[]).map(String);list.innerHTML=media.length?media.map(item=>`<div class="media-settings-item"><span>${esc(item)}</span><button type="button" onclick="deleteMediaItem('${attr(item)}')">×</button></div>`).join(''):'<div class="media-empty">추가된 매체 재료가 없습니다.</div>'}
    function openMediaSelectDialog(){renderMediaPicker();document.getElementById('mediaSelectDialog').showModal()}function openMediaSettingsDialog(){renderMediaSettingsList();setVal('settingsMedia','');document.getElementById('mediaSettingsDialog').showModal()}
    function selectedMediaValues(){return val('media').split(/\s*\/\s*|,\s*|，\s*/).map(x=>x.trim()).filter(Boolean)}function updateMediaFromChecks(){setVal('media',[...document.querySelectorAll('#mediaPicker input:checked')].map(i=>i.value).join(' / '));updateMediaDisplay()}function updateMediaDisplay(){const d=document.getElementById('mediaDisplay');if(d)d.textContent=val('media')||'선택된 매체가 없습니다.'}function clearMediaSelection(){setVal('media','');document.querySelectorAll('#mediaPicker input').forEach(i=>i.checked=false);updateMediaDisplay()}function removeMediaFromSelection(m){setVal('media',selectedMediaValues().filter(x=>x!==m).join(' / '));updateMediaDisplay()}
    function settingsAddMedia(){const media=val('settingsMedia');if(!media)return toast('매체를 입력하세요.');state.options.media=(state.options.media||[]).map(String);if(!state.options.media.includes(media)){state.options.media.push(media);state.options.media.sort()}saveLocalMediaOptions();setVal('settingsMedia','');fillLists();toast('매체를 추가했습니다.')}function deleteMediaItem(media){media=String(media);state.options.media=(state.options.media||[]).map(String).filter(x=>x!==media);removeMediaFromSelection(media);saveLocalMediaOptions();fillLists();toast('매체를 삭제했습니다.')}
    async function loadPhotoFiles(files){for(const file of files)state.photos.push({name:file.name,dataUrl:await readAsDataUrl(file)});document.getElementById('photoInput').value='';renderPhotos()}function renderPhotos(){document.getElementById('photoGrid').innerHTML=state.photos.map((p,i)=>`<article class="photo-card"><img src="${p.dataUrl||p.previewUrl||''}" alt=""><footer><span>${esc(p.name||`사진 ${i+1}`)}</span><button type="button" class="danger slim" onclick="removePhoto(${i})">삭제</button></footer></article>`).join('')}function removePhoto(i){state.photos.splice(i,1);renderPhotos()}
    async function startCamera(){try{state.cameraStream=await navigator.mediaDevices.getUserMedia({video:true,audio:false});document.getElementById('camera').srcObject=state.cameraStream;document.getElementById('cameraBox').classList.remove('hidden')}catch(e){showError(e)}}function capturePhoto(){const v=document.getElementById('camera'),c=document.createElement('canvas');c.width=v.videoWidth||1280;c.height=v.videoHeight||720;c.getContext('2d').drawImage(v,0,0,c.width,c.height);state.photos.push({name:`촬영_${new Date().toISOString().replace(/[:.]/g,'-')}.jpg`,dataUrl:c.toDataURL('image/jpeg',.9)});renderPhotos()}function stopCamera(){if(state.cameraStream)state.cameraStream.getTracks().forEach(t=>t.stop());state.cameraStream=null;document.getElementById('cameraBox').classList.add('hidden')}
    function openCurrent(field){if(!state.current||!state.current[field])return toast('먼저 저장된 일지를 선택하세요.');window.open(state.current[field],'_blank')}function openJournalPdf(id,field){const row=state.journals.find(r=>r.id===id);if(!row||!row[field])return toast('PDF가 아직 없습니다. 저장 후 다시 확인하세요.');window.open(row[field],'_blank')}function openFolder(field){if(state.folders[field])window.open(state.folders[field],'_blank');else toast('저장소 연결 후 열 수 있습니다.')}function openSubmissionDialog(){if(!state.current)return toast('먼저 저장된 일지를 선택하세요.');document.getElementById('includeDiary').checked=true;document.getElementById('includeLedger').checked=true;document.getElementById('submissionDialog').showModal()}function createSubmission(){closeDialog('submissionDialog');post('createSubmissionPdf',{id:state.current.id,includeDiary:document.getElementById('includeDiary').checked,includeLedger:document.getElementById('includeLedger').checked},5000).then(()=>refresh(()=>{toast('제출용 PDF를 생성했습니다.');loadJournal(state.current.id)})).catch(showError)}
    function openDeleteDialog(){if(!state.current)return toast('먼저 저장된 일지를 선택하세요.');document.getElementById('deleteDialog').showModal()}function deleteSelectedParts(){if(!confirm('선택한 항목을 삭제하시겠습니까?'))return;const options={data:document.getElementById('deleteData').checked,diaryPdf:document.getElementById('deleteDiaryPdf').checked,ledgerPdf:document.getElementById('deleteLedgerPdf').checked,submissionPdf:document.getElementById('deleteSubmissionPdf').checked,originalPhotos:document.getElementById('deleteOriginalPhotos').checked};closeDialog('deleteDialog');post('deleteJournalParts',{id:state.current.id,options}).then(()=>refresh(()=>{newJournal();toast('삭제했습니다.')})).catch(showError)}
    function closeDialog(id){document.getElementById(id).close()}function val(id){return document.getElementById(id).value.trim()}function setVal(id,v){document.getElementById(id).value=v||'';if(id==='media')updateMediaDisplay()}function setText(id,t){const el=document.getElementById(id);if(el)el.textContent=t}function setSaving(saving){state.saving=saving;document.getElementById('savingBanner').classList.toggle('active',saving);document.querySelectorAll('.save-button').forEach(b=>{b.disabled=saving;b.textContent=saving?'저장 중':'저장'})}function todayText(){return new Date().toISOString().slice(0,10)}function formatDateOnly(value){if(!value)return'';const text=String(value);const m=text.match(/^(\d{4})-(\d{2})-(\d{2})/);return m?`${m[1]}-${m[2]}-${m[3]}`:text.slice(0,10)}function loadLocalMediaOptions(){const saved=JSON.parse(localStorage.getItem('artTherapyMediaOptions')||'null');state.options.media=(saved&&saved.length?saved:['물감','색연필','비누','바다']).map(String).sort()}function saveLocalMediaOptions(){localStorage.setItem('artTherapyMediaOptions',JSON.stringify((state.options.media||[]).map(String).sort()))}function formatTimeValue(raw){const text=String(raw||'').trim();if(!text)return'';if(/^(AM|PM)\s+/i.test(text))return text.replace(/^(am|pm)/i,m=>m.toUpperCase());let hour,minute;const colon=text.match(/^(\d{1,2})(?::(\d{1,2}))?$/),compact=text.match(/^(\d{3,4})$/);if(colon){hour=Number(colon[1]);minute=Number(colon[2]||0)}else if(compact){hour=Number(compact[1].slice(0,-2));minute=Number(compact[1].slice(-2))}else return text;if(Number.isNaN(hour)||hour>23||minute>59)return text;const p=hour<12?'AM':'PM';let h=hour%12;if(h===0)h=12;return `${p} ${String(h).padStart(2,'0')}:${String(minute).padStart(2,'0')}`}
    function readAsDataUrl(file){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(file)})}function wait(ms){return new Promise(r=>setTimeout(r,ms))}function toast(msg){const b=document.getElementById('toast');b.textContent=msg;b.classList.remove('hidden');setTimeout(()=>b.classList.add('hidden'),2600)}function showError(e){toast(e&&e.message?e.message:String(e))}function esc(v){return String(v||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function attr(v){return esc(v).replace(/`/g,'&#96;')}
  </script>
